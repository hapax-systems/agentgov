[project]
name = "hapax-agentgov"
version = "0.3.2"
description = "[Archived] Early prototype superseded by hapax-systems/reins — Hapax Research Lab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hapax Research Lab", email = "hrl-han@hapaxresearch.com" }]
keywords = ["claude-code", "hooks", "governance", "ai-agents", "safety"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://hapaxresearch.com"
Repository = "https://github.com/hapax-systems/agentgov"
Documentation = "https://github.com/hapax-systems/reins"
Security = "https://github.com/hapax-systems/agentgov/blob/main/SECURITY.md"

[project.scripts]
agentgov = "agentgov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgov"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
